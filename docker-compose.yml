# 一键部署：mysql + monitor(模拟企业监控) + backend + frontend(nginx) + caddy(公网 HTTPS)
# 本地访问：http://localhost:8080
# 生产部署：docker compose --profile public up -d --build（公网 HTTPS 为 :8443）

name: it-helpdesk

services:
  mysql:
    # 国内网络用加速源（网络正常可改回 mysql:8.0）
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DB:-it_helpdesk}
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]
    restart: unless-stopped

  # 模拟企业 VPN 证书监控系统（P2：替代 mock 字典，走真实 HTTP 对接）
  # 换真实系统时删掉这个服务 + 改 backend 的 MONITOR_BASE_URL 指向真实地址
  monitor:
    build: ./backend
    command: uvicorn mock_monitor.server:app --host 0.0.0.0 --port 9100
    environment:
      MONITOR_JITTER_MS: ${MONITOR_JITTER_MS:-0}
      MONITOR_FAILURE_RATE: ${MONITOR_FAILURE_RATE:-0}
    volumes:
      - monitor_data:/app/backend/mock_monitor
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:?请在 .env 配置 ZHIPU_API_KEY}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODELS: ${GLM_MODELS:-glm-5.3-flash}
      # 兼容旧客户端的 fast / JSON 链同样锁定 glm-5.3-flash，禁止按模式换回答模型。
      GLM_MODELS_FAST: ${GLM_MODELS_FAST:-glm-5.3-flash}
      GLM_JSON_MODELS: ${GLM_JSON_MODELS:-glm-5.3-flash}
      GLM_VISION_MODELS: ${GLM_VISION_MODELS:-glm-4v-flash}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-it_helpdesk}
      # 监控对接：real 模式走 HTTP 调 monitor 服务
      MONITOR_MODE: ${MONITOR_MODE:-real}
      MONITOR_BASE_URL: http://monitor:9100
      MONITOR_TIMEOUT: ${MONITOR_TIMEOUT:-5.0}
      MONITOR_MAX_RETRIES: ${MONITOR_MAX_RETRIES:-2}
      # 安全：Token 签名密钥（生产务必在 .env 配置强随机值）
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      # 用户自定义模型的 API Key 加密密钥；必须与 SECRET_KEY 分离。
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-60}
      LLM_ALLOW_PRIVATE_ENDPOINTS: ${LLM_ALLOW_PRIVATE_ENDPOINTS:-false}
      AGENT_MAX_CONCURRENT: ${AGENT_MAX_CONCURRENT:-8}
      AGENT_MAX_INFLIGHT_HTTP: ${AGENT_MAX_INFLIGHT_HTTP:-16}
      AGENT_LOCK_DIR: /.rag/agent_locks
      DB_POOL_SIZE: ${DB_POOL_SIZE:-16}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-2}
      # RAG：镜像内 app/ 被扁平复制到 /app/app，显式固定源文档与向量索引路径，
      # 避免 BASE_DIR 在容器内解析为 / 后读到错误目录。
      KB_ROOT: /app/docs/knowledge
      KB_VECTOR_DIR: /.rag/kb_chroma
      KB_SYNC_MODE: ${KB_SYNC_MODE:-git}
      KB_GIT_EXPORT: /app/knowledge-source.json
      KB_SYNC_STATE_DIR: /.rag/sync
      KB_SOURCE_ID: shared-it-knowledge
      # 独立规模库（如 kb_docs_scale）只在部署者显式配置时参加联合检索。
      KB_EXTRA_COLLECTIONS: ${KB_EXTRA_COLLECTIONS:-}
      # 日志：级别可配（生产可调 WARNING 减噪）+ 文件轮转落盘
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - backend_logs:/app/logs   # 日志持久化（排障可查，容器重建不丢）
      # app.config 在容器内将索引根目录解析为 /.rag；卷必须挂在同一路径，
      # 否则容器重建会清掉实际使用的索引。
      - rag_data:/.rag           # Chroma 索引、蓝绿指针和转译缓存持久化
      - ./docs/knowledge:/app/docs/knowledge:ro  # 知识库源文档随代码更新，容器内只读
      - ./knowledge-source.json:/app/knowledge-source.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      monitor:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # 不暴露端口：只经 nginx 反代（内部服务）

  frontend:
    build: ./frontend
    ports:
      # 本地调试入口只绑定回环地址；公网访问统一走 caddy 的 HTTPS :8443。
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    container_name: it-helpdesk-caddy
    entrypoint: ["/bin/sh", "/usr/local/bin/helpdesk-caddy.sh"]
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./scripts/run_caddy.sh:/usr/local/bin/helpdesk-caddy.sh:ro
      # 复用数据分析项目已验证的公网 IP 证书；IP_CERT_DIR 只在服务器 .env 设置。
      - "${IP_CERT_DIR:-./.certs}:/etc/letsencrypt:ro"
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks: [app]
    restart: unless-stopped
    profiles: [public]

volumes:
  mysql_data:
  monitor_data:
  backend_logs:
  rag_data:
  caddy_data:
  caddy_config:

networks:
  app:
