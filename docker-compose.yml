# 一键部署：mysql + monitor(模拟企业监控) + backend + frontend(nginx)
# 用法：docker compose up -d --build
# 访问：http://localhost:8080

services:
  mysql:
    # 国内网络用加速源（网络正常可改回 mysql:8.0）
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DB:-it_helpdesk}
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]

  # 模拟企业 VPN 证书监控系统（P2：替代 mock 字典，走真实 HTTP 对接）
  # 换真实系统时删掉这个服务 + 改 backend 的 MONITOR_BASE_URL 指向真实地址
  monitor:
    build: ./backend
    command: uvicorn mock_monitor.server:app --host 0.0.0.0 --port 9100
    environment:
      MONITOR_JITTER_MS: ${MONITOR_JITTER_MS:-0}
      MONITOR_FAILURE_RATE: ${MONITOR_FAILURE_RATE:-0}
    volumes:
      - monitor_data:/app/backend/mock_monitor
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 6

  backend:
    build: ./backend
    environment:
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:?请在 .env 配置 ZHIPU_API_KEY}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODELS: ${GLM_MODELS:-glm-4.7-flash,glm-4.6-flash,glm-4.5-flash,glm-4-flash}
      GLM_VISION_MODELS: ${GLM_VISION_MODELS:-glm-4v-flash}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 配置 MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-it_helpdesk}
      # 监控对接：real 模式走 HTTP 调 monitor 服务
      MONITOR_MODE: ${MONITOR_MODE:-real}
      MONITOR_BASE_URL: http://monitor:9100
      MONITOR_TIMEOUT: ${MONITOR_TIMEOUT:-5.0}
      MONITOR_MAX_RETRIES: ${MONITOR_MAX_RETRIES:-2}
      # 安全：Token 签名密钥（生产务必在 .env 配置强随机值）
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      # 日志：级别可配（生产可调 WARNING 减噪）+ 文件轮转落盘
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - backend_logs:/app/logs   # 日志持久化（排障可查，容器重建不丢）
    depends_on:
      mysql:
        condition: service_healthy
      monitor:
        condition: service_healthy
    networks: [app]
    # 不暴露端口：只经 nginx 反代（内部服务）

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks: [app]

volumes:
  mysql_data:
  monitor_data:
  backend_logs:

networks:
  app:
