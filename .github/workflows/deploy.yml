name: Deploy to Aliyun

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ai-it-helpdesk-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 121.43.124.98
  DEPLOY_USER: github-deploy-helpdesk
  DEPLOY_PATH: /opt/ai-it-helpdesk

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure the deployment connection
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reject a superseded deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested_sha="$(git rev-parse HEAD)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tested_sha" != "$current_sha" ]; then
            echo "A newer main revision exists; this deployment is superseded." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export the tested Git knowledge snapshot
        run: |
          python -m pip install PyYAML==6.0.2
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          from app.rag.git_source import read_snapshot, write_export
          snapshot = read_snapshot(Path.cwd(), "HEAD", "docs/knowledge")
          write_export(snapshot, Path("knowledge-source.json"))
          print(f"Knowledge source: {snapshot.commit}, {len(snapshot.docs)} documents, {snapshot.snapshot_hash}")
          PY

      - name: Back up production database and knowledge volume
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          umask 077
          mkdir -p backups
          exec 9>backups/.retention.lock
          python3 -c 'import fcntl; fcntl.flock(9, fcntl.LOCK_EX | fcntl.LOCK_NB)'
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker compose ps --status running --services </dev/null | grep -qx backend; then
            docker compose stop backend </dev/null
            trap 'docker compose start backend </dev/null >/dev/null || true' EXIT
          fi
          if docker compose ps --status running --services </dev/null | grep -qx mysql; then
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqldump -uroot --single-transaction --routines --triggers "$MYSQL_DATABASE"' </dev/null > "backups/pre-sync-$stamp.sql"
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysqldump -uroot --single-transaction --no-tablespaces --set-gtid-purged=OFF --skip-comments "$MYSQL_DATABASE" kb_sources kb_sync_jobs' </dev/null > "backups/pre-sync-$stamp-knowledge.sql"
          fi
          if docker compose ps --all --services </dev/null | grep -qx backend; then
            docker compose run --rm --no-deps -T backend python -c 'import hashlib,json; from app.rag import generations as g; s=g.state(); chunks=g.resolve_store().get_all_meta(); fields=("active_generation","source_commit","active_collection","doc_count"); b={k:s[k] for k in fields}; b.update(content_metadata_sha256=hashlib.sha256(json.dumps(chunks,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest(),denied_ids=sorted(g.denied_ids())); print(json.dumps({"baseline":b},ensure_ascii=False))' </dev/null > "backups/pre-sync-$stamp-manifest.json"
            docker compose run --rm --no-deps -T backend python -c 'import sys,tarfile; t=tarfile.open(fileobj=sys.stdout.buffer, mode="w|gz"); t.add("/.rag", arcname="rag"); t.close()' </dev/null > "backups/pre-sync-$stamp-rag.tar.gz"
          fi
          test -s "backups/pre-sync-$stamp.sql"
          test -s "backups/pre-sync-$stamp-rag.tar.gz"
          test -s "backups/pre-sync-$stamp-knowledge.sql"
          test -s "backups/pre-sync-$stamp-manifest.json"
          printf 'pre-sync-%s\n' "$stamp" > backups/latest-kb-backup
          printf 'Backup verified: %s\n' "$stamp"
          REMOTE

      - name: Synchronize application source
        run: |
          set -euo pipefail
          rsync -az --delete --no-owner --no-group --itemize-changes \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/.idea/' \
            --exclude='/.venv/' \
            --exclude='/venv/' \
            --exclude='/AGENTS.md' \
            --exclude='/.rag/' \
            --exclude='/backups/' \
            --exclude='/logs/' \
            --exclude='/frontend/node_modules/' \
            --exclude='/frontend/dist/' \
            --exclude='/.pytest_cache/' \
            --exclude='/**/__pycache__/' \
            --exclude='/backend/mock_monitor/*.db' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild services on the server
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(".env")
          updates = {"GLM_MODELS": "glm-5.3-flash", "GLM_MODELS_FAST": "glm-5.3-flash",
                     "GLM_JSON_MODELS": "glm-5.3-flash", "KB_SYNC_MODE": "git"}
          lines = path.read_text().splitlines()
          output, seen = [], set()
          for line in lines:
              key = line.split("=", 1)[0].strip()
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          output.extend(f"{key}={value}" for key, value in updates.items() if key not in seen)
          temporary = path.with_name(".env.release-next")
          descriptor = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, "w") as handle:
              handle.write("\n".join(output) + "\n")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, path)
          PY
          docker compose --profile public config --quiet </dev/null
          docker compose --profile public up -d --build --force-recreate </dev/null
          docker compose ps </dev/null
          REMOTE

      - name: Verify the previous generation survived service restart
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)' </dev/null >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          exec 9>backups/.retention.lock
          python3 -c 'import fcntl; fcntl.flock(9, fcntl.LOCK_EX | fcntl.LOCK_NB)'
          read -r prefix < backups/latest-kb-backup
          [[ "$prefix" =~ ^pre-sync-[0-9]{8}T[0-9]{6}Z$ ]]
          read -r expected digest < <(python3 -c 'import json,sys; b=json.load(open(sys.argv[1]))["baseline"]; print(b["active_generation"],b["content_metadata_sha256"])' "backups/$prefix-manifest.json")
          docker compose exec -T backend python -c 'import hashlib,json,sys; from app.rag import generations as g; s=g.state(); data=g.resolve_store().get_all_meta(); actual=hashlib.sha256(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest(); assert s["active_generation"]==sys.argv[1] and actual==sys.argv[2], "Restart changed published knowledge"; print(json.dumps({"passed":True,"old_generation_survived_restart":True,"active_generation":s["active_generation"]}))' "$expected" "$digest" </dev/null > "backups/$prefix-restart-check.json"
          cat "backups/$prefix-restart-check.json"
          REMOTE

      - name: Build, verify and publish the Git knowledge generation
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose exec -T backend python -m app.rag.generations --publish --timeout 900"

      - name: Check the published hybrid retrieval path
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose exec -T backend python -m app.rag.release_check"

      - name: Restore the stopped knowledge backup into an isolated database
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash scripts/verify_kb_backup.sh" </dev/null

      - name: Retain protected generations, caches and verified backups
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          umask 077
          read -r prefix < backups/latest-kb-backup
          [[ "$prefix" =~ ^pre-sync-[0-9]{8}T[0-9]{6}Z$ ]]
          # Dry-run and apply each recompute roots. Preserve 7 days online + 7 in quarantine.
          python3 scripts/backup_retention.py --backup-dir backups > "backups/$prefix-backup-retention-preview.json"
          python3 scripts/backup_retention.py --backup-dir backups --apply > "backups/$prefix-backup-retention.json"
          python3 scripts/backup_retention.py --backup-dir backups --purge-expired --apply > "backups/$prefix-backup-retention-purge.json"
          # Wait for the backend process to exit, including any pinned Agent request/worker.
          docker compose stop backend </dev/null
          trap 'docker compose start backend </dev/null >/dev/null || true' EXIT
          docker compose run --rm --no-deps -T backend python -m app.rag.retention </dev/null > "backups/$prefix-kb-retention-preview.json"
          docker compose run --rm --no-deps -T backend python -m app.rag.retention --apply </dev/null > "backups/$prefix-kb-retention.json"
          docker compose run --rm --no-deps -T backend python -m app.rag.retention --purge-expired --apply </dev/null > "backups/$prefix-kb-retention-purge.json"
          docker compose start backend </dev/null
          trap - EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)' </dev/null >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose exec -T backend python -m app.rag.release_check </dev/null > "backups/$prefix-retention-retrieval-check.json"
          cat "backups/$prefix-retention-retrieval-check.json"
          REMOTE

      - name: Download recovery evidence
        run: |
          mkdir -p recovery-evidence
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backups/*-restore-check.json" recovery-evidence/
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backups/*-restart-check.json" recovery-evidence/
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backups/*-retention*.json" recovery-evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-restore-evidence
          path: recovery-evidence/*.json
          if-no-files-found: error

      - name: Check the public service
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "https://$DEPLOY_HOST:8443/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "The public readiness endpoint did not become healthy in time." >&2
          exit 1
