name: Production TLS maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [inspect, reload]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: ai-it-helpdesk-tls
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect certificate and renewal service
        env:
          TLS_ACTION: ${{ inputs.action }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            github-deploy-helpdesk@121.43.124.98 bash -s -- "$TLS_ACTION" <<'REMOTE'
          set -euo pipefail
          cd /opt/ai-it-helpdesk
          docker compose exec -T caddy cat /etc/letsencrypt/live/121.43.124.98/fullchain.pem </dev/null | openssl x509 -noout -dates -serial
          if [ "$1" = reload ]; then
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --force </dev/null
          fi
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://121.43.124.98:8443/health
          REMOTE
