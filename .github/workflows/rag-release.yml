name: RAG release evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate frozen synthetic snapshot
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python -m scripts.eval_rag_release --output-dir .rag/release-eval
      - name: Save synthetic evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-release-report
          path: backend/.rag/release-eval/report.json
          include-hidden-files: true
          if-no-files-found: error
