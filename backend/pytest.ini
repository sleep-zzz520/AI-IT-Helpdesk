[pytest]
# 测试工程化（ROADMAP P3.1）：统一 pytest 套件
# 用法：cd backend && pytest
#
# pythonpath = . : 让 `import app.*` 从 backend/ 根解析
# testpaths      : 只收集 tests/ 下的 test_*.py（不碰 scripts/ 的脚本式冒烟测试）
# addopts        : -q 精简输出；-p no:cacheprovider 不写 .pytest_cache（避免进 git）
# markers        : 注册标记，避免 unknown-mark 告警
pythonpath = .
testpaths = tests
addopts = -q -p no:cacheprovider
markers =
    offline: 不依赖真实 GLM / MySQL，可离线回归（默认）
    eval: 真实 Eval（依赖 GLM + MySQL），需显式 -m eval 才跑
