server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端（同源：浏览器无 CORS 问题）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 实时推送必需：nginx 默认缓冲会把事件攒着不发，导致前端看不到实时链路
        proxy_buffering off;
        proxy_read_timeout 300s;   # Agent 一轮可能跑十几秒，放宽读超时
    }

    # 健康检查反代（/health 在 backend 根路径，不在 /api 下）
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # FastAPI 接口文档反代（/docs 在 backend 根路径，不在 /api 下）
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 静态文件 + SPA 兜底（刷新路由都回到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
